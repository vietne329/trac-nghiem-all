<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn Thi Trắc Nghiệm</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#e4e7ec;
  --primary:#2f6fed; --primary-soft:#e8efff; --ok:#12805c; --ok-soft:#e3f6ee;
  --bad:#c4321f; --bad-soft:#fdecea; --warn:#9a6700; --warn-soft:#fff6db;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --card:#171d2b; --text:#e6e9f0; --muted:#98a2b3; --line:#2a3245;
    --primary:#6b9bff; --primary-soft:#1d2a47; --ok:#4cc79a; --ok-soft:#14302a;
    --bad:#ff7a66; --bad-soft:#3a1d1a; --warn:#f0c04a; --warn-soft:#352c12;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171d2b; --text:#e6e9f0; --muted:#98a2b3; --line:#2a3245;
  --primary:#6b9bff; --primary-soft:#1d2a47; --ok:#4cc79a; --ok-soft:#14302a;
  --bad:#ff7a66; --bad-soft:#3a1d1a; --warn:#f0c04a; --warn-soft:#352c12;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.set{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.set:hover{border-color:var(--primary);transform:translateY(-2px)}
.set.active{border-color:var(--primary);outline:2px solid var(--primary-soft)}
.set h3{margin:0 0 6px;font-size:1.1rem}
.set p{margin:0;color:var(--muted);font-size:.92rem}
.badge{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;margin-bottom:10px}
label.f{display:block;font-weight:600;margin:16px 0 6px}
select,input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--text)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ghost{background:transparent}
.btn.ans{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:var(--primary);width:0;transition:width .2s}
.qmeta{color:var(--muted);font-size:.88rem;margin-bottom:6px}
.qtext{font-size:1.15rem;font-weight:600;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--primary)}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--primary-soft);color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.explain{margin-top:14px;border-left:4px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:12px 14px}
.explain.nokey{border-color:var(--warn);background:var(--warn-soft)}
.explain b{display:block;margin-bottom:4px}
.explain .note{margin-top:6px;font-size:.88rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:16px}
.palette button{font:inherit;font-size:.85rem;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.palette button.done{background:var(--primary-soft);border-color:var(--primary)}
.palette button.cur{outline:2px solid var(--primary)}
.palette button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
details.pal summary{cursor:pointer;color:var(--muted);margin-top:16px}
.score{font-size:2.4rem;font-weight:800;margin:6px 0}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.review{margin-top:18px}
.review .item{border-top:1px solid var(--line);padding:14px 0}
.review .item:first-child{border-top:0}
.tag{font-size:.8rem;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.skip{background:var(--line);color:var(--muted)}
.hidden{display:none!important}
.theme{position:fixed;top:12px;right:12px}
.theme .btn{padding:6px 10px;font-size:.85rem}
@media (max-width:520px){.qtext{font-size:1.05rem}.wrap{padding-top:52px}}
</style>
</head>
<body>
<div class="theme"><button class="btn ghost" id="themeBtn" title="Đổi giao diện sáng/tối">◐ Giao diện</button></div>
<div class="wrap">

<!-- MÀN HÌNH CHỌN ĐỀ -->
<section id="home">
  <h1>Ôn thi trắc nghiệm</h1>
  <p class="sub">Chọn 1 trong 3 bộ đề, chọn phần muốn làm rồi bấm “Bắt đầu”.</p>
  <div class="grid" id="sets"></div>
  <div class="card hidden" id="setup" style="margin-top:16px">
    <div class="row" style="justify-content:space-between"><strong id="setupTitle"></strong></div>
    <label class="f" for="secSel">Phần / chủ đề</label>
    <select id="secSel"></select>
    <label class="f" for="limit">Số câu muốn làm (để trống = tất cả)</label>
    <input type="number" id="limit" min="1" placeholder="Tất cả">
    <label class="chk"><input type="checkbox" id="shuffle"> Đảo thứ tự câu hỏi</label>
    <label class="chk"><input type="checkbox" id="instant" checked> Hiện đúng/sai ngay khi chọn đáp án</label>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="startBtn">Bắt đầu</button></div>
  </div>
</section>

<!-- MÀN HÌNH LÀM BÀI -->
<section id="quiz" class="hidden">
  <div class="top">
    <button class="btn ghost" id="backBtn">← Chọn đề khác</button>
    <span id="counter" class="qmeta"></span>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="card">
    <div class="qmeta" id="qsec"></div>
    <p class="qtext" id="qtext"></p>
    <div id="opts"></div>
    <div class="row" style="margin-top:6px">
      <button class="btn ans" id="showAns">💡 Xem đáp án chi tiết</button>
    </div>
    <div id="explain" class="explain hidden"></div>
    <div class="nav">
      <button class="btn" id="prevBtn">← Câu trước</button>
      <button class="btn primary" id="submitBtn">Nộp bài</button>
      <button class="btn" id="nextBtn">Câu sau →</button>
    </div>
    <details class="pal"><summary>Danh sách câu hỏi</summary><div class="palette" id="palette"></div></details>
  </div>
</section>

<!-- MÀN HÌNH KẾT QUẢ -->
<section id="result" class="hidden">
  <div class="card">
    <div class="qmeta" id="rTitle"></div>
    <div class="score" id="rScore"></div>
    <div class="stats" id="rStats"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="retryBtn">Làm lại</button>
      <button class="btn" id="wrongBtn">Làm lại các câu sai</button>
      <button class="btn ghost" id="homeBtn">Chọn đề khác</button>
    </div>
  </div>
  <div class="card review" id="review"></div>
</section>

</div>
<script>
const DATA = [{"name": "Bộ 200 câu", "desc": "Biểu tượng văn hóa thế giới, chỉ số kinh tế, thơ ca & văn học Việt Nam", "sections": [{"title": "50 CÂU TRẮC NGHIỆM VỀ BIỂU TƯỢNG VÀ VĂN HÓA NỔI BẬT CỦA CÁC QUỐC GIA TRÊN THẾ GIỚI", "questions": [{"n": 1, "q": "Hoa anh đào là biểu tượng văn hóa nổi tiếng của quốc gia nào?", "options": ["Hàn Quốc", "Nhật Bản", "Trung Quốc", "Thái Lan"], "answer": "B", "explain": "Hoa anh đào (sakura) là quốc hoa, biểu tượng văn hóa đặc trưng của Nhật Bản, gắn với lễ hội ngắm hoa Hanami.", "flag": ""}, {"n": 2, "q": "Kim chi là món ăn truyền thống nổi tiếng của quốc gia nào?", "options": ["Nhật Bản", "Việt Nam", "Hàn Quốc", "Trung Quốc"], "answer": "C", "explain": "Kim chi là món rau muối lên men truyền thống của Hàn Quốc; nghề làm kim chi (kimjang) được UNESCO ghi danh.", "flag": ""}, {"n": 3, "q": "Gấu trúc lớn được xem là biểu tượng động vật của quốc gia nào?", "options": ["Nepal", "Trung Quốc", "Mông Cổ", "Ấn Độ"], "answer": "B", "explain": "Gấu trúc lớn chỉ sống tự nhiên ở Trung Quốc (Tứ Xuyên, Thiểm Tây, Cam Túc) và là biểu tượng quốc gia của nước này.", "flag": ""}, {"n": 4, "q": "Hoa sen thường được xem là biểu tượng của quốc gia nào?", "options": ["Việt Nam", "Singapore", "Malaysia", "Indonesia"], "answer": "A", "explain": "Hoa sen được coi là quốc hoa, biểu tượng văn hóa của Việt Nam (cũng là quốc hoa Ấn Độ, nhưng không có trong phương án).", "flag": "Hoa sen cũng là quốc hoa của Ấn Độ; với các phương án đã cho thì A hợp lý."}, {"n": 5, "q": "Kangaroo là biểu tượng nổi tiếng của quốc gia nào?", "options": ["New Zealand", "Canada", "Úc", "Nam Phi"], "answer": "C", "explain": "Kangaroo là loài thú có túi đặc hữu của Úc, xuất hiện trên quốc huy Úc.", "flag": ""}, {"n": 6, "q": "Chim kiwi là biểu tượng đặc trưng của quốc gia nào?", "options": ["Fiji", "Úc", "New Zealand", "Samoa"], "answer": "C", "explain": "Chim kiwi là loài chim đặc hữu của New Zealand; người New Zealand còn được gọi là 'Kiwi'.", "flag": ""}, {"n": 7, "q": "Lá phong đỏ là biểu tượng quốc gia của nước nào?", "options": ["Hoa Kỳ", "Canada", "Anh", "Ireland"], "answer": "B", "explain": "Lá phong đỏ nằm giữa quốc kỳ Canada và là biểu tượng quốc gia của Canada.", "flag": ""}, {"n": 8, "q": "Tháp Eiffel là biểu tượng nổi tiếng của quốc gia nào?", "options": ["Đức", "Ý", "Pháp", "Tây Ban Nha"], "answer": "C", "explain": "Tháp Eiffel ở Paris, xây năm 1889, là biểu tượng của nước Pháp.", "flag": ""}, {"n": 9, "q": "Đồng hồ Big Ben là biểu tượng nổi tiếng của quốc gia nào?", "options": ["Ireland", "Anh", "Scotland", "Wales"], "answer": "B", "explain": "Big Ben là tháp đồng hồ thuộc Cung điện Westminster ở London, biểu tượng của nước Anh.", "flag": ""}, {"n": 10, "q": "Đấu trường Colosseum là biểu tượng văn hóa của quốc gia nào?", "options": ["Hy Lạp", "Ý", "Tây Ban Nha", "Bồ Đào Nha"], "answer": "B", "explain": "Đấu trường Colosseum ở Rome là công trình thời La Mã cổ đại, biểu tượng của Ý.", "flag": ""}, {"n": 11, "q": "Hoa tulip gắn liền với quốc gia nào?", "options": ["Hà Lan", "Bỉ", "Đức", "Áo"], "answer": "A", "explain": "Hà Lan nổi tiếng thế giới với những cánh đồng và ngành xuất khẩu hoa tulip, coi tulip là biểu tượng quốc gia.", "flag": ""}, {"n": 12, "q": "Cối xay gió là hình ảnh biểu tượng của quốc gia nào?", "options": ["Đan Mạch", "Na Uy", "Hà Lan", "Thụy Điển"], "answer": "C", "explain": "Cối xay gió (như ở Kinderdijk) là hình ảnh đặc trưng của Hà Lan, dùng để tháo nước, cải tạo đất trũng.", "flag": ""}, {"n": 13, "q": "Nàng tiên cá nổi tiếng là biểu tượng của quốc gia nào?", "options": ["Đan Mạch", "Phần Lan", "Na Uy", "Iceland"], "answer": "A", "explain": "Tượng Nàng tiên cá ở Copenhagen, lấy cảm hứng từ truyện của Andersen, là biểu tượng của Đan Mạch.", "flag": ""}, {"n": 14, "q": "Lâu đài Dracula nổi tiếng gắn liền với quốc gia nào?", "options": ["Hungary", "Romania", "Bulgaria", "Serbia"], "answer": "B", "explain": "Lâu đài Bran ở vùng Transylvania (Romania) được gọi là lâu đài Dracula.", "flag": ""}, {"n": 15, "q": "K " nghĩa là câu cá mùa thu, nên bài thơ còn có tên Câu cá mùa thu.", "flag": ""}, {"n": 21, "q": "Nhà thơ nào được xem là \"ông tổ của phong trào Thơ Mới\"?", "options": ["Xuân Diệu", "Huy Cận", "Tản Đà", "Thế Lữ"], "answer": "C", "explain": "Tản Đà được coi là người mở đường, \"gạch nối\" giữa thơ cũ và Thơ Mới, nên thường được xem như tiền thân/ông tổ của Thơ Mới.", "flag": "Đáp án gây tranh cãi: Tản Đà thường được gọi là người dạo bản đàn mở đầu cho Thơ Mới, nhưng có tài liệu coi Thế Lữ là người \"cắm ngọn cờ chiến thắng\" của Thơ Mới."}, {"n": 22, "q": "Bài thơ Nhớ rừng là tác phẩm tiêu biểu của:", "options": ["Thế Lữ", "Hàn Mặc Tử", "Xuân Diệu", "Nguyễn Bính"], "answer": "A", "explain": "Nhớ rừng (1934) là bài thơ tiêu biểu nhất của Thế Lữ.", "flag": ""}, {"n": 23, "q": "Nhớ rừng mượn hình tượng con vật nào để thể hiện tâm trạng?", "options": ["Đại bàng", "Hổ", "Sói", "Hươu"], "answer": "B", "explain": "Bài thơ mượn lời con hổ bị nhốt trong vườn bách thú để nói lên tâm trạng chán ghét thực tại, khao khát tự do.", "flag": ""}, {"n": 24, "q": "Tác giả bài thơ Đây thôn Vĩ Dạ là:", "options": ["Huy Cận", "Xuân Diệu", "Hàn Mặc Tử", "Chế Lan Viên"], "answer": "C", "explain": "Đây thôn Vĩ Dạ là bài thơ nổi tiếng của Hàn Mặc Tử, in trong tập Thơ Điên.", "flag": ""}, {"n": 25, "q": "Hàn Mặc Tử là gương mặt tiêu biểu của phong trào nào?", "options": ["Thơ Mới", "Thơ cách mạng", "Văn học hiện thực", "Văn học trung đại"], "answer": "A", "explain": "Hàn Mặc Tử là một trong những nhà thơ tiêu biểu, độc đáo nhất của phong trào Thơ Mới (1932–1945).", "flag": ""}, {"n": 26, "q": "Nhà thơ nào được mệnh danh là \"Ông hoàng thơ tình\"?", "options": ["Huy Cận", "Xuân Diệu", "Nguyễn Bính", "Chế Lan Viên"], "answer": "B", "explain": "Xuân Diệu được mệnh danh là \"ông hoàng thơ tình\" của thi ca Việt Nam.", "flag": ""}, {"n": 27, "q": "Tập thơ nổi tiếng của Xuân Diệu trước Cách mạng là:", "options": ["Điêu tàn", "Lửa thiêng", "Thơ thơ", "Gửi hương cho gió"], "answer": "C", "explain": "Thơ thơ (1938) là tập thơ đầu tay nổi tiếng của Xuân Diệu; Điêu tàn của Chế Lan Viên, Lửa thiêng của Huy Cận.", "flag": "Câu hỏi chưa chặt: Gửi hương cho gió (1945) cũng là tập thơ của Xuân Diệu trước Cách mạng tháng Tám."}, {"n": 28, "q": "Tác giả bài thơ Tràng giang là:", "options": ["Xuân Diệu", "Huy Cận", "Chế Lan Viên", "Tế Hanh"], "answer": "B", "explain": "Tràng giang (1939) là bài thơ của Huy Cận, in trong tập Lửa thiêng.", "flag": ""}, {"n": 29, "q": "Tập thơ Lửa thiêng là của tác giả nào?", "options": ["Xuân Diệu", "Huy Cận", "Nguyễn Bính", "Chế Lan Viên"], "answer": "B", "explain": "Lửa thiêng (1940) là tập thơ tiêu biểu của Huy Cận trước Cách mạng.", "flag": ""}, {"n": 30, "q": "Bài thơ Quê hương nổi tiếng về làng chài ven biển của ai?", "options": ["Tế Hanh", "Huy Cận", "Nguyễn Bính", "Chính Hữu"], "answer": "A", "explain": "Quê hương (\"Làng tôi ở vốn làm nghề chài lưới\") là bài thơ của Tế Hanh viết về làng chài quê ông.", "flag": ""}, {"n": 31, "q": "Tác giả tập thơ Điêu tàn là:", "options": ["Huy Cận", "Chế Lan Viên", "Hàn Mặc Tử", "Tế Hanh"], "answer": "B", "explain": "Điêu tàn (1937) là tập thơ đầu tay của Chế Lan Viên, viết khi ông mới 17 tuổi.", "flag": ""}, {"n": 32, "q": "Hình tượng trung tâm trong bài thơ Tràng giang là:", "options": ["Núi rừng", "Dòng sông", "Biển cả", "Cánh đồng"], "answer": "B", "explain": "\"Tràng giang\" nghĩa là sông dài; hình tượng dòng sông mênh mang là trung tâm của bài thơ.", "flag": ""}, {"n": 33, "q": "\"Lớp lớp mây cao đùn núi bạc\" là câu thơ trong bài:", "options": ["Đây thôn Vĩ Dạ", "Tràng giang", "Tây Tiến", "Việt Bắc"], "answer": "B", "explain": "\"Lớp lớp mây cao đùn núi bạc, Chim nghiêng cánh nhỏ bóng chiều sa\" là câu thơ trong khổ cuối bài Tràng giang.", "flag": ""}, {"n": 34, "q": "Nhà thơ nào nổi tiếng với cảm hứng \"vội vàng sống\"?", "options": ["Nguyễn Bính", "Xuân Diệu", "Hàn Mặc Tử", "Huy Cận"], "answer": "B", "explain": "Xuân Diệu với bài Vội vàng thể hiện quan niệm sống vội vàng, cuồng nhiệt, tận hưởng tuổi trẻ.", "flag": ""}, {"n": 35, "q": "Câu thơ \"Tôi muốn tắt nắng đi\" nằm trong bài:", "options": ["Vội vàng", "Tương tư", "Tràng giang", "Đây thôn Vĩ Dạ"], "answer": "A", "explain": "\"Tôi muốn tắt nắng đi, Cho màu đừng nhạt mất\" là câu mở đầu bài Vội vàng của Xuân Diệu.", "flag": ""}, {"n": 36, "q": "Tác phẩm nào thể hiện rõ nhất quan niệm sống gấp của Xuân Diệu?", "options": ["Vội vàng", "Nguyệt cầm", "Tràng giang", "Chiều xuân"], "answer": "A", "explain": "Vội vàng là tuyên ngôn sống vội, sống gấp của Xuân Diệu (\"Mau đi thôi! Mùa chưa ngả chiều hôm\").", "flag": ""}, {"n": 37, "q": "Nhà thơ nào được gọi là \"thi sĩ của đồng quê\"?", "options": ["Nguyễn Bính", "Tố Hữu", "Quang Dũng", "Thanh Thảo"], "answer": "A", "explain": "Nguyễn Bính với hồn thơ chân quê, mộc mạc được xem là thi sĩ của đồng quê.", "flag": ""}, {"n": 38, "q": "Tác phẩm nào sau đây không thuộc phong trào Thơ Mới?", "options": ["Đồng chí", "Tràng giang", "Đây thôn Vĩ Dạ", "Vội vàng"], "answer": "A", "explain": "Đồng chí của Chính Hữu ra đời năm 1948, thuộc thơ ca kháng chiến chống Pháp, không thuộc Thơ Mới (1932–1945).", "flag": ""}, {"n": 39, "q": "Tác phẩm Đồng chí ra đời trong cuộc kháng chiến nào?", "options": ["Chống Mỹ", "Chống Pháp", "Chống Nguyên Mông", "Chống Thanh"], "answer": "B", "explain": "Đồng chí được Chính Hữu sáng tác đầu năm 1948, sau chiến dịch Việt Bắc thu đông 1947 trong kháng chiến chống Pháp.", "flag": ""}, {"n": 40, "q": "Hình ảnh người lính Tây Tiến hiện lên nổi bật với phẩm chất nào?", "options": ["Hào hoa, dũng cảm", "Giàu có", "Bảo thủ", "Thực dụng"], "answer": "A", "explain": "Người lính Tây Tiến trong thơ Quang Dũng mang vẻ đẹp hào hoa, lãng mạn mà dũng cảm, bi tráng.", "flag": ""}, {"n": 41, "q": "Câu thơ \"Áo bào thay chiếu anh về đất\" thuộc bài:", "options": ["Đồng chí", "Tây Tiến", "Việt Bắc", "Bếp lửa"], "answer": "B", "explain": "Câu thơ thuộc khổ thơ thứ ba bài Tây Tiến, nói về sự hi sinh bi tráng của người lính.", "flag": ""}, {"n": 42, "q": " ag": "Có nhiều chùa Hang (Trà Vinh, Kiên Giang - Hòn Chông) nên câu hỏi hơi mơ hồ; đáp án in A chấp nhận được."}, {"n": 100, "q": "Bãi biển Hồ Cốc thuộc tỉnh nào?", "options": ["Bình Thuận", "Khánh Hòa", "Bà Rịa – Vũng Tàu", "Ninh Thuận"], "answer": "C", "explain": "Bãi biển Hồ Cốc thuộc huyện Xuyên Mộc, tỉnh Bà Rịa – Vũng Tàu.", "flag": ""}]}, {"title": "I. TOÁN LOGIC", "questions": [{"n": 1, "q": "Khi chia số 242 cho số k thì số dư thu được là 8. Khi chia 698 cho số k thì số dư thu được là 9. Tuy nhiên, khi chia tổng của hai số 242 và 698 cho số k thì số dư thu được là 4. Giá trị của k là bao nhiêu?", "options": ["23", "11", "13", "17"], "answer": null, "explain": "Gợi ý: C. Tổng hai số dư là 8 + 9 = 17, khi chia tổng 940 cho k dư 4 nên k = 17 − 4 = 13 (kiểm tra: 234 = 13·18, 689 = 13·53).", "flag": ""}, {"n": 2, "q": "Chọn số thích hợp điền vào dấu hỏi chấm. [Bảng 4×4: hàng 1: 1, 10, 7, 16; hàng 2: 28, 19, 22, 13; hàng 3: 25, 34, 31, 40; hàng 4: ?, 43, 46, 37]", "options": ["54", "58", "52", "56"], "answer": null, "explain": "Gợi ý: C. Mỗi hàng thay đổi theo quy luật ±9, ±3 xen kẽ (hàng 4: ? − 9 = 43, 43 + 3 = 46, 46 − 9 = 37) nên ? = 52; cột 1 cũng khớp: 1 +27 = 28, −3 = 25, +27 = 52.", "flag": ""}, {"n": 3, "q": "Với −1 < x < 0, thứ tự tăng dần của các số x⁻¹, x⁻², x⁻³, x⁻⁴ là", "options": ["x⁻⁴, x⁻³, x⁻², x⁻¹", "x⁻³, x⁻¹, x⁻², x⁻⁴", "x⁻¹, x⁻³, x⁻², x⁻⁴", "x⁻¹, x⁻², x⁻³, x⁻⁴"], "answer": null, "explain": "Gợi ý: B. Lấy x = −1/2: x⁻¹ = −2, x⁻² = 4, x⁻³ = −8, x⁻⁴ = 16, nên thứ tự tăng dần là x⁻³ < x⁻¹ < x⁻² < x⁻⁴.", "flag": "Một phần đề bị watermark che, đọc được theo ngữ cảnh."}, {"n": 4, "q": "Theo quy định, các hộ thuộc diện chính sách, hộ nghèo sẽ được Nhà nước hỗ trợ 20 triệu đồng/hộ để xây nhà khi bị thiệt hại hoàn toàn sau bão lũ. Ngoài ra, Ủy ban nhân dân tỉnh hỗ trợ thêm cho mỗi hộ thuộc diện chính sách, hộ nghèo bị thiệt hại hoàn toàn sau bão lũ là 20 triệu đồng. Tổng số tiền hỗ trợ của Nhà nước và Ủy ban tỉnh cho các hộ này lên đến 36 tỷ đồng, hỏi có bao nhiêu hộ thuộc diện chính sách, hộ nghèo của tỉnh bị thiệt hại hoàn toàn sau bão lũ đã nhận được tiền hỗ trợ để xây nhà?", "options": ["900", "850", "800", "950"], "answer": null, "explain": "Gợi ý: A. Mỗi hộ nhận 20 + 20 = 40 triệu đồng, nên số hộ là 36.000 triệu : 40 triệu = 900 hộ.", "flag": ""}, {"n": 5, "q": "Một nhóm nhân viên của cửa hàng A phải lắp ráp 280 màn hình để bán trong đợt khuyến mại sắp tới. Nếu họ lắp ráp được 25% số màn hình trong giờ đầu tiên và 40% số màn hình còn lại trong giờ thứ hai thì cuối giờ thứ hai, bao nhiêu màn hình chưa được lắp ráp?", "options": ["70", "168", "126", "98"], "answer": null, "explain": "Gợi ý: C. Giờ đầu lắp 70, còn 210; giờ thứ hai lắp 40% của 210 = 84, còn lại 210 − 84 = 126 màn hình.", "flag": ""}, {"n": 6, "q": "Nếu x, y, z, t ≠ 0 và x/y + z/t = 1 thì y/x + t/z =", "options": ["xz/(yt)", "2", "1", "yt/(xz)"], "answer": null, "explain": "Gợi ý: D. Đặt a = x/y, b = z/t với a + b = 1; khi đó 1/a + 1/b = (a + b)/(ab) = 1/(ab) = yt/(xz).", "flag": "Vế 'y/x + t/z' bị watermark che một phần, suy ra theo ngữ cảnh."}, {"n": 7, "q": "Số nào nhân với 4/7 bằng 6/7?", "options": ["7/2", "24/7", "3/2", "2/7"], "answer": null, "explain": "Gợi ý: C. Số cần tìm = (6/7) : (4/7) = 6/4 = 3/2.", "flag": ""}, {"n": 8, "q": "Một người cần giao chính xác tám bưu kiện: G, H, J, K, L, M, N và O, trong đó không có hai bưu kiện nào được giao cùng một lúc và không có bất kỳ bưu kiện nào được giao nhiều hơn một lần. Biết rằng: L được giao muộn hơn H; K được giao sớm hơn O; H được giao sớm hơn M; O được giao muộn hơn G; M được giao sớm hơn G; Cả N và J đều được giao sớm hơn M. Nếu L được giao sớm hơn K, thì phát biểu nào sau đây là sai?", "options": ["N là bưu kiện thứ hai được giao.", "L là bưu kiện thứ ba được giao.", "H là bưu kiện thứ tư được giao.", "K là bưu kiện thứ năm được giao."], "answer": null, "explain": "Gợi ý: C. Khi L sớm hơn K thì H phải giao trước L, K, O, M, G (5 bưu kiện) nên H chỉ có thể ở vị trí 1–3; H không thể là bưu kiện thứ tư.", "flag": ""}, {"n": 9, "q": "Bốn anh em chia nhau một khoản tiền. Người anh cả nhận được 50% tổng số tiền, người anh thứ hai nhận được 25% tổng số tiền, người anh thứ ba nhận được 20% tổng số tiền, và người em út nhận được 40 triệu đồng còn lại. Khoản tiền mà bốn anh em đã chia nhau là bao nhiêu?", "options": ["600 triệu đồng", "100 triệu đồng", "800 triệu đồng", "750 triệu đồng"], "answer": null, "explain": "Gợi ý: C. Người em út nhận 100% − 95% = 5% tổng số tiền = 40 triệu, nên tổng là 800 triệu đồng.", "flag": ""}, {"n": 10, "q": "Trên bàn có 3 loại quả: táo, đào, bưởi. Mỗi người trong gia đình có 3 thành viên chỉ thích một loại quả và sở thích của mỗi người khác nhau. Bố không thích bưởi. Bà không thích bưởi và táo. Minh thích quả gì?", "options": ["Bưởi", "Táo", "Không đủ dữ kiện", "Đào"], "answer": null, "explain": "Gợi ý: A. Bà không thích bưởi và táo nên thích đào; Bố không thích bưởi nên thích táo; Minh thích bưởi.", "flag": ""}, {"n": 11, "q": "Trung bình một người đàn ông cứ 4 lần bắn thì bắn trúng mục tiêu một lần. Nếu anh ta bắn 4 lần liên tiếp thì xác suất để anh ta bắn trúng mục tiêu là bao nhiêu?", "options": ["175/256", "81/256", "144/256", "1/256"], "answer": null, "explain": "Gợi ý: A. Xác suất trúng ít nhất một lần = 1 − (3/4)⁴ = 1 − 81/256 = 175/256.", "flag": ""}, {"n": 12, "q": "Hình nào bị thiếu? [Hình: lưới 3×3 ô chứa các hình tròn đen và trắng, ô cuối cùng bị trống]", "options": ["[Hình: ô có 1 hình tròn đen]", "[Hình: ô có 1 tròn trắng và 1 tròn đen]", "[Hình: ô có 1 tròn trắng]", "[Hình: ô có 2 tròn đen và 3 tròn trắng]"], "answer": null, "explain": "Gợi ý: D. Mỗi hàng và mỗi cột đều có tổng cộng 5 hình tròn đen và 6 hình tròn trắng; cột 3 (và hàng 3) còn thiếu 2 đen, 3 trắng, đúng với hình D.", "flag": "Câu hỏi dạng hình vẽ; các phương án là hình, được mô tả bằng lời."}, {"n": 13, "q": "Tìm một số thích hợp điền vào dấu hỏi chấm cho phù hợp với quy luật của dãy số sau: 55, 50, 45, 40, ?", "options": ["50", "30", "35", "55"], "answer": null, "explain": "Gợi ý: C. Dãy giảm đều 5 đơn vị nên số tiếp theo là 40 − 5 = 35.", "flag": "Phương án B bị watermark che, đọc là 30."}, {"n": 14, "q": "Mức lương trung bình của một công nhân trong 15 ngày làm việc liên tục là $90 mỗi ngày. Trong 7 ngày đầu tiên, mức lương trung bình của anh ta là $87 mỗi ngày và mức lương trung bình trong 7 ngày sau cùng là $92 mỗi ngày. Mức lương của anh ấy vào ngày thứ 8 là bao nhiêu?", "options": ["$83", "$97", "$92", "$90"], "answer": null, "explain": "Gợi ý: B. Ngày thứ 8 = 15·90 − 7·87 − 7·92 = 1350 − 609 − 644 = $97.", "flag": ""}, {"n": 15, "q": "Trong chương trình thời trang LFW gần đây, bảy nhà thiết kế thời trang đã giới thiệu trang phục của họ. Tên trang phục của các nhà thiết kế được ký hiệu là: C, L, W, G, D, J và S. Trang phục của các nhà thiết kế này được đặt thành một hàng theo thứ tự sau: (i) S được đặt ngay bên trái của C. (ii) C đứng thứ tư ở bên trái của D. (iii) L nằm giữa G và W. (iv) D đứng thứ ba ở bên phải của G và là một trong trong các trang phục được đặt cuối hàng. Khẳng định nào sau đây không đúng?", "options": ["S và C được đặt liên tiếp", "J ở đầu hàng hoặc cuối hàng.", "Vị trí của J và W có thể hoán đổi cho nhau.", "Có hai trang phục ở giữa C và W."], "answer": null, "explain": "Gợi ý: C. Thứ tự duy nhất là J, S, C, G, L, W, D; nếu đổi chỗ J và W thì L không còn nằm giữa G và W nên khẳng định C sai.", "flag": ""}, {"n": 16, "q": "Khẳng định nào sau đây đúng với mọi số thực a, b thỏa mãn điều kiện ab < 0?", "options": ["a + b < 0", "a − b > 0", "a/b < 0", "a + b < 0"], "answer": null, "explain": "Gợi ý: C. ab < 0 nghĩa là a, b trái dấu, nên thương a/b luôn âm; các khẳng định khác không luôn đúng.", "flag": "Phương án A và D in giống nhau (a + b < 0)."}, {"n": 17, "q": "Một người nông dân có 17 con cừu. Trừ 9 con, còn lại người nông dân đó bán hết. Vậy, người nông dân còn lại bao nhiêu con cừu?", "options": ["9", "10", "8", "11"], "answer": null, "explain": "Gợi ý: A. 'Trừ 9 con, còn lại bán hết' nghĩa là giữ lại đúng 9 con.", "flag": ""}, {"n": 18, "q": "Chọn một số thích hợp để điền vào chỗ trống 84, 52, 36, 28, 24, 22,____", "options": ["20", "18", "21", "22"], "answer": null, "explain": "Gợi ý: C. Hiệu giữa các số liên tiếp là 32, 16, 8, 4, 2 (giảm một nửa), tiếp theo là 1, nên số cần điền là 22 − 1 = 21.", "flag": ""}, {"n": 19, "q": "Cho hàm số h(x) = x² − 8x, với x ≥ 4. Tìm h⁻¹(−12).", "options": ["1/240", "4", "240", "6"], "answer": null, "explain": "Gợi ý: D. Giải x² − 8x = −12 được x = 2 hoặc x = 6; với điều kiện x ≥ 4 thì h⁻¹(−12) = 6.", "flag": ""}, {"n": 20, "q": "Trong hình vẽ dưới đây, biết rằng góc POQ = 80° và x > 20°. Khẳng định nào sau đây là đúng về giá trị của y? [Hình: góc POQ được chia bởi hai tia thành ba góc y, x, 20° tính từ OP đến OQ]", "options": ["y > 45°", "y > 40°", "y < 40°", "y > 50°"], "answer": null, "explain": "Gợi ý: C. y + x + 20° = 80° nên y = 60° − x; vì x > 20° nên y < 40°.", "flag": ""}, {"n": 21, "q": "Có bao nhiêu số nguyên x thoả mãn bất phương trình 11 ≤ 5 − 3x < 23?", "options": ["2", "5", "4", "3"], "answer": null, "explain": "Gợi ý: C. 11 ≤ 5 − 3x < 23 ⇔ 6 ≤ −3x < 18 ⇔ −6 < x ≤ −2, nên có 4 số nguyên: −5, −4, −3, −2.", "flag": ""}, {"n": 22, "q": "Chọn một số thích hợp để điền vào chỗ trống 0, 3, 8, 15,____, 35, 48", "options": ["22", "24", "26", "11"], "answer": null, "explain": "Gợi ý: B. Dãy có dạng n² − 1 (n = 1, 2, 3, ...) nên số còn thiếu là 5² − 1 = 24.", "flag": ""}, {"n": 23, "q": "Trung vị của dãy số 4, 6, 4, 10, 7 là", "options": ["4", "7", "10", "6"], "answer": null, "explain": "Gợi ý: D. Sắp xếp lại: 4, 4, 6, 7, 10; số ở giữa là 6.", "flag": ""}, {"n": 24, "q": "Nếu lg4 = a và lg5 = b thì lg20 bằng bao nhiêu?", "options": ["a + b", "a^b", "a × b", "a − b"], "answer": null, "explain": "Gợi ý: A. lg20 = lg(4·5) = lg4 + lg5 = a + b.", "flag": ""}, {"n": 25, "q": "Một cái thùng phi hình trụ có chiều cao 2 m và bán kính đáy 0,5 m. Khi đó, diện tích xung quanh của thùng phi đó là", "options": ["2π m²", "0,25π m²", "π m²", "0,2π m²"], "answer": null, "explain": "Gợi ý: A. Diện tích xung quanh = 2πrh = 2π·0,5·2 = 2π m².", "flag": ""}]}, {"title": "II. KIẾN THỨC KINH TẾ XÃ HỘI", "questions": [{"n": 26, "q": "Giải pháp hợp lý đối với các nước đang phát triển khi muốn đẩy nhanh tốc độ tăng trưởng kinh tế trong tình trạng đang có lạm phát cao là:", "options": ["Tăng hiệu quả sử dụng vốn.", "Tăng đầu tư", "Giảm đầu tư", "Tăng xuất khẩu"], "answer": null, "explain": "Gợi ý: A. Khi lạm phát cao, tăng đầu tư sẽ làm lạm phát trầm trọng hơn, còn giảm đầu tư làm chậm tăng trưởng; vì vậy cần nâng cao hiệu quả sử dụng vốn.", "flag": ""}, {"n": 27, "q": "Quốc gia duy nhất nào trên thế giới mà trang phục truyền thống của đàn ông là váy caro được làm từ loại vải dệt Tartan?", "options": ["Scotland", "Áo", "Pháp", "Hy Lạp"], "answer": null, "explain": "Gợi ý: A. Váy kilt làm từ vải tartan kẻ caro là trang phục truyền thống của đàn ông Scotland.", "flag": ""}, {"n": 28, "q": "Lễ hội cà phê Buôn Ma Thuột hiện nay thường được tổ chức với tần suất:", "options": ["3 năm/lần", "2 năm/lần", "1 năm/lần", "4 năm/lần"], "answer": null, "explain": "Gợi ý: B. Lễ hội Cà phê Buôn Ma Thuột được tổ chức định kỳ 2 năm một lần (2019, 2021/2023, 2025...).", "flag": ""}, {"n": 29, "q": "Nếu một người thợ đóng giày mua một miếng da giá 100 nghìn đồng, một bộ kim chỉ giá 10 nghìn đồng, và dùng chúng để khâu đôi giày bán cho người tiêu dùng giá 500 nghìn đồng, thì giá trị đóng góp của anh ta vào GDP là:", "options": ["390 nghìn đồng", "500 nghìn đồng", "610 nghìn đồng", "110 nghìn đồng"], "answer": null, "explain": "Gợi ý: A. Đóng góp vào GDP là giá trị gia tăng = 500 − (100 + 10) = 390 nghìn đồng.", "flag": "Phương án C bị watermark che một phần, đọc là 610 nghìn đồng."}, {"n": 30, "q": "Trường hợp nào dưới đây là một thất bại của thị trường?", "options": ["Một số doanh nghiệp phá sản do không cạnh tranh được với các doanh nghiệp khác có chi phí sản xuất thấp hơn", "Phân bổ nguồn lực do thị trường tạo ra không đúng với chỉ đạo của chính phủ", "Chính phủ không lường trước hết được phản ứng của khu vực tư nhân trước quyết định chính sách của mình", "Người mua hàng hóa trên thị trường thường biết ít thông tin về hàng hóa hơn so với người bán"], "answer": null, "explain": "Gợi ý: D. Thông tin bất cân xứng giữa người mua và người bán là một dạng thất bại thị trường; A là cạnh tranh bình thường, C là thất bại của chính phủ.", "flag": ""}, {"n": 31, "q": "Việt Nam có chung biên giới với quốc gia nào sau đây?", "options": ["Thái Lan", "Campuchia", "Indonesia", "Myanmar"], "answer": null, "explain": "Gợi ý: B. Việt Nam có biên giới đất liền với Trung Quốc, Lào và Campuchia.", "flag": ""}, {"n": 32, "q": "Quyết định thăng chức cho cán bộ phụ trách tiền lương lên vị trí trưởng phòng nhân sự có một số lợi thế sau đây, ngoại trừ", "options": ["Tiết kiệm chi phí tuyển dụng", "Động viên khuyến khích những người đang làm việc tại tổ chức", "Tiết kiệm thời gian tuyển dụng", "Có cơ hội thay đổi chất lượng nguồn nhân lực của doanh nghiệp"], "answer": null, "explain": "Gợi ý: D. Tuyển dụng nội bộ (thăng chức) tiết kiệm chi phí, thời gian và tạo động lực, nhưng không mang lại nhân lực mới để thay đổi chất lượng nguồn nhân lực - đó là ưu điểm của tuyển dụng bên ngoài.", "flag": ""}, {"n": 33, "q": "Sức ép của các nhà cung cấp đối với doanh nghiệp sẽ giảm nếu:", "options": ["Sản phẩm cung cấp không quá quan trọng với doanh nghiệp", "Số lượng nhà cung cấp ít", "Chi phí chuyển đổi nhà cung cấp cao", "Tất cả đáp án trên đều đúng"], "answer": null, "explain": "Gợi ý: A. Khi sản phẩm cung cấp không quan trọng, doanh nghiệp ít phụ thuộc nên sức ép nhà cung cấp giảm; số lượng nhà cung cấp ít và chi phí chuyển đổi cao đều làm tăng sức ép.", "flag": "Một phần chữ phương án A bị watermark che ('Sản phẩm')."}, {"n": 34, "q": "Sử gia đầu tiên của Việt Nam là:", "options": ["Lê Văn Hưu", "Trần Trọng Kim", "Phan Phù Tiên", "Ngô Sĩ Liên"], "answer": null, "explain": "Gợi ý: A. Lê Văn Hưu, tác giả Đại Việt sử ký (1272) thời Trần, được coi là nhà sử học đầu tiên của Việt Nam.", "flag": ""}, {"n": 35, "q": "Để thực hiện ISO 9000, nhà quản trị phải tiến hành các hoạt động nào?", "options": ["Kiểm tra tất cả các sản phẩm tại phòng Kiểm soát chất lượng sản phẩm (KCS)", "Viết những gì cần làm và làm những gì đã viết", "Lưu giữ hồ sơ, đặc biệt là trong trường hợp viết và làm khác nhau", "Cả A, B, C đều đúng"], "answer": null, "explain": "Gợi ý: D. Theo câu hỏi trắc nghiệm phổ biến, việc áp dụng ISO 9000 gồm kiểm soát chất lượng, 'viết những gì cần làm, làm những gì đã viết' và lưu hồ sơ, nên chọn 'Cả A, B, C đều đúng'.", "flag": "Đáp án gợi ý chưa chắc chắn: theo tinh thần ISO 9000, B (và C) là cốt lõi, còn A ('kiểm tra tất cả sản phẩm tại KCS') có thể bị xem là sai."}, {"n": 36, "q": "Giả sử chỉ số giá là 100 vào năm 2000 và 400 vào năm 2025. Khi đó, sức mua của 1 triệu đồng vào năm 2025 sẽ tương đương với sức mua là bao nhiêu vào năm 2000?", "options": ["600 nghìn đồng", "400 nghìn đồng", "250 nghìn đồng", "Không điều nào ở trên"], "answer": null, "explain": "Gợi ý: C. Giá tăng gấp 4 lần nên 1 triệu đồng năm 2025 tương đương 1.000 : 4 = 250 nghìn đồng năm 2000.", "flag": ""}, {"n": 37, "q": "Những thông tin nào dưới đây cho chúng ta biết đặc điểm nhân khẩu học của khách hàng?", "options": ["Độ tuổi", "Tình trạng hôn nhân", "Giới tính", "Tất cả các thông tin trên"], "answer": null, "explain": "Gợi ý: D. Độ tuổi, giới tính và tình trạng hôn nhân đều là biến nhân khẩu học.", "flag": ""}, {"n": 38, "q": "Tỷ trọng dân số vị thành niên trong tổng dân số có xu hướng:", "options": ["Không đổi ở các nước đang phát triển", "Tăng lên ở các nước phát triển", "Giảm ở các nước đang phát triển", "Giảm ở các nước phát triển"], "answer": null, "explain": "Gợi ý: C. Do tỷ suất sinh giảm mạnh, tỷ trọng dân số vị thành niên ở các nước đang phát triển có xu hướng giảm.", "flag": "Câu hỏi mơ hồ: ở các nước phát triển tỷ trọng này cũng giảm (D cũng có thể đúng)."}, {"n": 39, "q": "Kh vốn và đất đai", "Máy móc, nhà xưởng và trang trại", "Lao động, tiền và đất đai."], "answer": null, "explain": "Gợi ý: B. Các yếu tố sản xuất cơ bản gồm lao động, vốn và đất đai (tài nguyên).", "flag": ""}, {"n": 49, "q": "Theo kết quả điều tra dân số năm 2024, tỷ lệ nam/nữ của Việt Nam là:", "options": ["Nhỏ hơn 1", "Lớn hơn 2", "Lớn hơn 1", "Bằng 1"], "answer": null, "explain": "Gợi ý: A. Theo điều tra dân số giữa kỳ 2024, tỷ số giới tính khoảng 99,4 nam/100 nữ, tức tỷ lệ nam/nữ nhỏ hơn 1.", "flag": "Phương án B bị watermark che, đọc là 'Lớn hơn 2'."}, {"n": 50, "q": "Đối tượng bảo hiểm của bảo hiểm trách nhiệm dân sự là", "options": ["Phần trách nhiệm hành chính có thể phát sinh của người được bảo hiểm.", "Phần trách nhiệm hình sự có thể phát sinh của người được bảo hiểm.", "Phần trách nhiệm dân sự và hình sự có thể phát sinh của người được bảo hiểm.", "Phần trách nhiệm dân sự có thể phát sinh của người được bảo hiểm."], "answer": null, "explain": "Gợi ý: D. Đối tượng của bảo hiểm trách nhiệm dân sự là trách nhiệm bồi thường dân sự của người được bảo hiểm đối với bên thứ ba; trách nhiệm hình sự/hành chính không bảo hiểm được.", "flag": ""}]}]}];

const $ = id => document.getElementById(id);
const L = ["A","B","C","D","E","F"];
let curSet = null, list = [], idx = 0, picks = {}, shown = {}, submitted = false;

// ---- Giao diện sáng/tối
(function(){
  let t = null; try { t = localStorage.getItem("quiz-theme"); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $("themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const n = dark ? "light" : "dark";
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem("quiz-theme", n); } catch(e){}
  };
})();

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function show(id){ ["home","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); }

// ---- Màn hình chọn đề
function renderHome(){
  $("sets").innerHTML = DATA.map((s,i) => {
    const n = s.sections.reduce((a,x) => a + x.questions.length, 0);
    return `<button class="card set" data-i="${i}"><span class="badge">${n} câu</span><h3>${esc(s.name)}</h3><p>${s.sections.length} phần · ${esc(s.desc||"")}</p></button>`;
  }).join("");
  document.querySelectorAll(".set").forEach(b => b.onclick = () => pickSet(+b.dataset.i));
}
function pickSet(i){
  curSet = DATA[i];
  document.querySelectorAll(".set").forEach(b => b.classList.toggle("active", +b.dataset.i === i));
  $("setup").classList.remove("hidden");
  $("setupTitle").textContent = curSet.name;
  $("secSel").innerHTML = `<option value="-1">Tất cả các phần (${curSet.sections.reduce((a,x)=>a+x.questions.length,0)} câu)</option>` +
    curSet.sections.map((s,j) => `<option value="${j}">${esc(s.title)} (${s.questions.length} câu)</option>`).join("");
  $("setup").scrollIntoView({behavior:"smooth", block:"nearest"});
}
$("startBtn").onclick = () => {
  const sec = +$("secSel").value;
  let qs = [];
  curSet.sections.forEach((s,j) => { if (sec < 0 || sec === j) s.questions.forEach(q => qs.push({...q, sec:s.title})); });
  if ($("shuffle").checked) qs = qs.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]);
  const lim = parseInt($("limit").value, 10);
  if (lim > 0) qs = qs.slice(0, lim);
  start(qs);
};
function start(qs){
  list = qs; idx = 0; picks = {}; shown = {}; submitted = false;
  show("quiz"); renderQ();
}

// ---- Làm bài
function renderQ(){
  const q = list[idx];
  $("counter").textContent = `Câu ${idx+1} / ${list.length} · Đã làm ${Object.keys(picks).length}`;
  $("bar").style.width = ((idx+1)/list.length*100) + "%";
  $("qsec").textContent = `${q.sec} — Câu ${q.n}`;
  $("qtext").textContent = q.q;
  const reveal = shown[idx] || submitted || ($("instant").checked && picks[idx] !== undefined);
  $("opts").innerHTML = q.options.map((o,k) => {
    let c = "opt";
    if (picks[idx] === k) c += " sel";
    if (reveal && q.answer) {
      if (L[k] === q.answer) c += " right";
      else if (picks[idx] === k) c += " wrong";
    }
    return `<button class="${c}" data-k="${k}"><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  document.querySelectorAll("#opts .opt").forEach(b => b.onclick = () => {
    if (submitted) return;
    picks[idx] = +b.dataset.k; renderQ();
  });
  renderExplain(q, shown[idx] || submitted);
  $("showAns").textContent = shown[idx] ? "🙈 Ẩn đáp án" : "💡 Xem đáp án chi tiết";
  $("prevBtn").disabled = idx === 0;
  $("nextBtn").disabled = idx === list.length-1;
  $("submitBtn").textContent = submitted ? "Xem kết quả" : "Nộp bài";
  renderPalette();
}
function explainHTML(q){
  if (q.answer) {
    const k = L.indexOf(q.answer);
    return `<b>Đáp án đúng: ${q.answer}. ${esc(q.options[k] ?? "")}</b>${esc(q.explain||"")}${q.flag ? `<div class="note">⚠ Lưu ý: ${esc(q.flag)}</div>` : ""}`;
  }
  return `<b>Tài liệu gốc không in đáp án cho câu này.</b>${esc(q.explain||"")}${q.flag ? `<div class="note">⚠ ${esc(q.flag)}</div>` : ""}`;
}
function renderExplain(q, on){
  const e = $("explain");
  e.classList.toggle("hidden", !on);
  e.classList.toggle("nokey", !q.answer);
  if (on) e.innerHTML = explainHTML(q);
}
$("showAns").onclick = () => { shown[idx] = !shown[idx]; renderQ(); };
$("prevBtn").onclick = () => { if (idx > 0) { idx--; renderQ(); } };
$("nextBtn").onclick = () => { if (idx < list.length-1) { idx++; renderQ(); } };
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden") || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") $("nextBtn").click();
  else if (e.key === "ArrowLeft") $("prevBtn").click();
  else { const k = "abcd".indexOf(e.key.toLowerCase()); if (k >= 0 && k < list[idx].options.length && !submitted) { picks[idx] = k; renderQ(); } }
});
function status(i){
  const q = list[i];
  if (picks[i] === undefined) return "skip";
  if (!q.answer) return "na";
  return L[picks[i]] === q.answer ? "ok" : "no";
}
function renderPalette(){
  $("palette").innerHTML = list.map((q,i) => {
    let c = "";
    if (submitted) { const s = status(i); c = s === "ok" ? "ok" : s === "no" ? "no" : ""; }
    else if (picks[i] !== undefined) c = "done";
    if (i === idx) c += " cur";
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join("");
  document.querySelectorAll("#palette button").forEach(b => b.onclick = () => { idx = +b.dataset.i; renderQ(); });
}
$("submitBtn").onclick = () => {
  if (!submitted) {
    const left = list.length - Object.keys(picks).length;
    if (left > 0 && !confirm(`Bạn còn ${left} câu chưa làm. Vẫn nộp bài?`)) return;
    submitted = true;
  }
  renderResult();
};

// ---- Kết quả
function renderResult(){
  let ok = 0, no = 0, skip = 0, na = 0;
  list.forEach((q,i) => { const s = status(i); if (s==="ok") ok++; else if (s==="no") no++; else if (s==="skip") skip++; else na++; });
  const graded = list.filter(q => q.answer).length;
  $("rTitle").textContent = `${curSet.name} — ${list.length} câu`;
  $("rScore").textContent = `${ok} / ${graded} câu đúng` + (graded ? ` · ${(ok/graded*10).toFixed(1)} điểm` : "");
  $("rStats").innerHTML = `<span>✅ Đúng: ${ok}</span><span>❌ Sai: ${no}</span><span>⏭ Bỏ qua: ${skip}</span>` + (na ? `<span>❔ Không có đáp án gốc: ${na}</span>` : "");
  $("wrongBtn").disabled = no + skip === 0;
  $("review").innerHTML = "<h3 style='margin-top:0'>Đáp án chi tiết từng câu</h3>" + list.map((q,i) => {
    const s = status(i);
    const tag = s==="ok" ? `<span class="tag ok">Đúng</span>` : s==="no" ? `<span class="tag no">Sai</span>` : s==="skip" ? `<span class="tag skip">Chưa làm</span>` : "";
    const mine = picks[i] !== undefined ? `Bạn chọn: <b>${L[picks[i]]}. ${esc(q.options[picks[i]])}</b>` : "Bạn chưa chọn đáp án";
    return `<div class="item"><div class="qmeta">${i+1}. ${esc(q.sec)} — Câu ${q.n}${tag}</div><div style="font-weight:600">${esc(q.q)}</div>
      <div class="qmeta" style="margin-top:4px">${mine}</div>
      <details><summary class="btn ans" style="display:inline-block;margin-top:8px;padding:6px 12px;font-size:.88rem">💡 Xem đáp án chi tiết</summary>
      <div class="explain ${q.answer?"":"nokey"}">${explainHTML(q)}</div></details></div>`;
  }).join("");
  show("result");
}
$("retryBtn").onclick = () => start(list);
$("wrongBtn").onclick = () => start(list.filter((q,i) => ["no","skip"].includes(status(i))));
$("homeBtn").onclick = () => show("home");
$("backBtn").onclick = () => { if (submitted || !Object.keys(picks).length || confirm("Thoát bài đang làm?")) show("home"); };

renderHome();
</script>
</body>
</html>
